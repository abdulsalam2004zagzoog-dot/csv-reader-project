name: Python Checks

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          find . -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -print0 | xargs -0 -n1 python -m py_compile